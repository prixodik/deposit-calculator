schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: deposit-calculator — калькулятор выплат по банковскому депозиту.
  Stack: Python 3.12+, pytest, стандартная библиотека decimal для всех денежных расчётов
  (float для денег запрещён).
  Process: spec-driven (OpenSpec) → tests first (TDD) → implementation.
  Актуальную документацию библиотек проверять через context7, а не по памяти.
  Commits: Conventional Commits, мелкие и осмысленные.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

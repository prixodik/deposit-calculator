name: Проверки

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    name: Проверки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Проверка типов
        run: npm run typecheck
      - name: Проверка БЭМ
        run: npm run check:bem
      - name: Тесты
        run: npm test
      - name: Сборка
        run: npm run build
      - name: Установка браузера для сквозных тестов
        run: npx playwright install --with-deps chromium
      - name: Сквозные тесты
        run: npm run test:e2e
